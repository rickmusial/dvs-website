# CI MIRROR of the workspace's .vale.ini — the DVS writing floor, as code.
#
# ⛔ THIS IS A MIRROR. The canonical config and rules live in the workspace repo at
# /.vale.ini and /styles/DVS/. They are duplicated here because CI runs in THIS repo
# and cannot reach a private sibling repo without a token.
#
# ⚑ THE DUPLICATION IS CHECKED, NOT TRUSTED. Both copies sit under the workspace tree
# (this repo is a sub-repo at Pipeline/DVS_Website/App), so dvs_doc_code_registry.json
# registers the pair and dvs_doc_code_check.sh FAILS THE CLOSE if any rule drifts.
# Edit the canonical files; re-copy here in the same act. See DCR 258.
StylesPath = styles
MinAlertLevel = suggestion

[*.{md,html}]
BasedOnStyles = DVS

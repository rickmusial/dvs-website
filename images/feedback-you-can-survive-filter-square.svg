<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" role="img">
  <title>You select the feedback you can survive — a filter strains out every no and lets only yes through</title>
  <desc>All the feedback you could hear meets a filter of kind people, soft questions and leading framing. The nos are caught on top; only yeses pass through to what you hear.</desc>
  <defs>
    <marker id="fbs-grey" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6B6B72"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="#F7F3EB"/>
  <text x="540" y="92" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="3" fill="#BE8223">THE FEEDBACK YOU CAN SURVIVE</text>
  <text x="540" y="132" text-anchor="middle" font-size="21" fill="#6B6B72">Ask the kind people the soft questions, and the answer can only be yes.</text>
  <line x1="90" y1="168" x2="990" y2="168" stroke="#BE8223" stroke-opacity="0.25" stroke-width="1.5"/>

  <text x="540" y="236" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#6B6B72">WHAT THEY COULD TELL YOU</text>
  <!-- mix of pills -->
  <g font-size="19" font-weight="600">
    <rect x="250" y="270" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#6B6B72" stroke-width="1.3"/><text x="310" y="297" text-anchor="middle" fill="#6B6B72">I'd use it</text>
    <rect x="620" y="270" width="96" height="40" rx="20" fill="#FFFFFF" stroke="#6B6B72" stroke-width="1.3"/><text x="668" y="297" text-anchor="middle" fill="#6B6B72">love it</text>
    <rect x="790" y="270" width="118" height="40" rx="20" fill="#FFFFFF" stroke="#6B6B72" stroke-width="1.3"/><text x="849" y="297" text-anchor="middle" fill="#6B6B72">nice idea</text>
  </g>
  <g font-size="19" font-weight="700">
    <rect x="406" y="270" width="74" height="40" rx="20" fill="#BE8223"/><text x="443" y="297" text-anchor="middle" fill="#FFFFFF">NO</text>
    <rect x="500" y="334" width="140" height="40" rx="20" fill="#BE8223"/><text x="570" y="361" text-anchor="middle" fill="#FFFFFF">won't pay</text>
    <rect x="338" y="334" width="70" height="40" rx="20" fill="#BE8223"/><text x="373" y="361" text-anchor="middle" fill="#FFFFFF">no</text>
  </g>

  <!-- arrow down into filter -->
  <path d="M540,318 L540,452" fill="none" stroke="#6B6B72" stroke-width="2" marker-end="url(#fbs-grey)" stroke-dasharray="3 7"/>

  <!-- filter bar -->
  <rect x="230" y="470" width="620" height="74" rx="12" fill="#EDE8DC" stroke="#1A1A1E" stroke-width="1.8"/>
  <rect x="320" y="492" width="22" height="10" rx="5" fill="#F7F3EB"/>
  <rect x="530" y="492" width="22" height="10" rx="5" fill="#F7F3EB"/>
  <rect x="740" y="492" width="22" height="10" rx="5" fill="#F7F3EB"/>
  <text x="540" y="588" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.5" fill="#1A1A1E">YOUR SELECTION</text>
  <text x="540" y="612" text-anchor="middle" font-size="15" fill="#6B6B72">kind people · soft questions · leading framing</text>

  <text x="540" y="688" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#6B6B72">WHAT YOU HEAR</text>
  <g font-size="19" font-weight="600">
    <rect x="360" y="716" width="74" height="40" rx="20" fill="#FFFFFF" stroke="#6B6B72" stroke-width="1.3"/><text x="397" y="743" text-anchor="middle" fill="#6B6B72">yes</text>
    <rect x="500" y="716" width="70" height="40" rx="20" fill="#FFFFFF" stroke="#6B6B72" stroke-width="1.3"/><text x="535" y="743" text-anchor="middle" fill="#6B6B72">go</text>
    <rect x="636" y="716" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#6B6B72" stroke-width="1.3"/><text x="696" y="743" text-anchor="middle" fill="#6B6B72">I'd use it</text>
  </g>

  <text x="540" y="1010" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1A1A1E">If your research never changes your mind, you're not</text>
  <text x="540" y="1042" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1A1A1E">testing — you're collecting reassurance.</text>
</svg>

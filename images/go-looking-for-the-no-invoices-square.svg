<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" role="img">
  <title>The same flaw, two invoices: find it now for a hard question, or in twelve months for a year of building</title>
  <desc>A flaw in your idea exists today either way. Going looking for it now costs a hard question; avoiding it costs a year of building later.</desc>
  <defs>
    <marker id="nos-gold" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#BE8223"/></marker>
    <marker id="nos-dark" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1A1A1E"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="#F7F3EB"/>
  <text x="540" y="92" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="3" fill="#BE8223">GO LOOKING FOR THE NO</text>
  <text x="540" y="132" text-anchor="middle" font-size="21" fill="#6B6B72">The flaw exists now either way. Only the invoice changes.</text>
  <line x1="90" y1="168" x2="990" y2="168" stroke="#BE8223" stroke-opacity="0.25" stroke-width="1.5"/>

  <path d="M540,236 L584,286 L540,336 L496,286 Z" fill="#1A1A1E"/>
  <text x="540" y="298" text-anchor="middle" font-size="28" font-weight="700" fill="#F7F3EB">!</text>
  <text x="540" y="384" text-anchor="middle" font-size="20" font-weight="600" fill="#1A1A1E">The flaw — it's there today</text>

  <path d="M500,322 L300,452" fill="none" stroke="#BE8223" stroke-width="2.6" marker-end="url(#nos-gold)"/>
  <text x="262" y="430" text-anchor="middle" font-size="17" font-weight="600" fill="#BE8223">go looking for it now</text>
  <path d="M580,322 L786,452" fill="none" stroke="#6B6B72" stroke-width="2.2" marker-end="url(#nos-dark)"/>
  <text x="822" y="430" text-anchor="middle" font-size="17" font-weight="600" fill="#6B6B72">avoid it</text>

  <!-- LEFT small gold invoice -->
  <rect x="120" y="470" width="320" height="150" rx="10" fill="#FBF3E2" stroke="#BE8223" stroke-width="3"/>
  <text x="148" y="512" font-size="15" font-weight="700" letter-spacing="2" fill="#BE8223">PAY NOW</text>
  <text x="148" y="554" font-family="Georgia, serif" font-size="30" fill="#1A1A1E">A hard question</text>
  <text x="148" y="586" font-size="17" fill="#6B6B72">a coffee. a little discomfort.</text>

  <!-- RIGHT large dark invoice -->
  <rect x="560" y="448" width="430" height="262" rx="10" fill="#FFFFFF" stroke="#1A1A1E" stroke-width="2.4"/>
  <text x="592" y="494" font-size="15" font-weight="700" letter-spacing="2" fill="#6B6B72">PAY LATER</text>
  <text x="592" y="544" font-family="Georgia, serif" font-size="40" fill="#1A1A1E">A year of building</text>
  <text x="592" y="586" font-size="18" fill="#6B6B72">the build · the launch · the savings</text>
  <text x="592" y="614" font-size="18" fill="#6B6B72">the runway · the year you don't get back</text>
  <text x="592" y="662" font-size="18" font-weight="600" fill="#1A1A1E">Same flaw. Bigger invoice.</text>

  <text x="540" y="1014" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="23" fill="#1A1A1E">A yes that could never have been a no isn't worth having.</text>
</svg>

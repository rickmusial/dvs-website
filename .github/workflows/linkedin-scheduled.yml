name: Post to LinkedIn (scheduled queue)

# The "I never have to remember" poster. Once a day it publishes any PRE-APPROVED
# post in scheduled/linkedin-queue.json whose date is due, self-verifies, commits
# the updated queue, and FAILS LOUDLY (GitHub emails Rick) if anything didn't land.
# Spec: DVS-LPS-2026-001 v2.0 §5. Authorship stays human — this only ships queued,
# already-approved text (MIF-067).
#
# GitHub Actions cron is UTC. Rick is AEST (UTC+10).
#   30 22 * * *  (UTC)  =  08:30 AEST daily  — the morning slot.
# An entry only posts on/after its `date`, so a daily check is safe: most days
# nothing is due and the run is a no-op.

on:
  schedule:
    - cron: '30 22 * * *'    # 22:30 UTC = 08:30 AEST, every day
  workflow_dispatch: {}        # manual trigger — for testing / catch-up

permissions:
  contents: write              # commit the updated queue (status ready → posted)

concurrency:
  group: linkedin-scheduled
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # DVS-SHC-2026-001 Layer 1 (S224). Mints a short-lived access token from the
      # stored refresh token and exports it via GITHUB_ENV, overriding the secret
      # for this job only. Fail-soft: with no refresh secrets configured it exits 0
      # and the run proceeds on LINKEDIN_TOKEN exactly as before.
      # ⚑ This step is the SINGLE WRITER of LINKEDIN_TOKEN for the job. It exports
      # either the freshly minted token or the existing secret passed through
      # unchanged. The poster step below therefore declares NO LINKEDIN_TOKEN of its
      # own — a competing step-level declaration would risk silently discarding the
      # minted value, and GitHub's docs do not settle that precedence.
      - name: Mint a fresh LinkedIn access token
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}   # fallback, passed through when minting is off or fails
        run: node scripts/linkedin-mint-token.mjs

      - name: Publish any queued post whose date is due
        env:
          # LINKEDIN_TOKEN intentionally NOT declared here — it arrives from the mint
          # step via GITHUB_ENV. Do not re-add it. See DVS-SHC-2026-001.
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_LOW_RUNWAY: '1'   # S201: recalibrated for the 4/week cadence (2 cuts/week, S200) — alarm only when the queue is down to its last ready cut
        run: node scripts/post-linkedin-queue.mjs

      - name: Commit queue state if it changed
        if: always()           # commit even if a later step failed, so 'posted'/'failed' status persists
        run: |
          if [[ -n "$(git status --porcelain scheduled/linkedin-queue.json)" ]]; then
            git config user.name  "dvs-bot"
            git config user.email "bot@digitalventurestudio.com"
            git add scheduled/linkedin-queue.json
            git commit -m "linkedin queue: update post status [skip ci]"
            git push
          else
            echo "Queue unchanged."
          fi
